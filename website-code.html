<!DOCTYPE html>
<!--
  TRY THIS (in order, easiest first):
    [ ] Change the heading text
    [ ] Put your name and favourite colour in the box
    [ ] Fill in the three things you like
    [ ] Change a colour in the CSS (look for the "try changing" notes)
    [ ] Change the message the button pops up
  ============================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Page</title>

  <style>
    /* ===================== CSS LIVES HERE ===================== */
    /* CSS = the CLOTHES. It never changes WHAT is on the page,   */
    /* only how it LOOKS. Try changing the values after the ":"   */

    body {
      font-family: Arial, sans-serif;
      background-color: #e2fafb;   /* <- try: lightblue, #ffe4e1, black */
      color: #2b1d17;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #7ec627;              /* <- try changing this colour! */
      font-size: 48px;             /* <- try making this bigger or smaller */
    }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    .my-box {
      background-color: #ffffff;
      border: 3px border #273cc6;   /* <- try: dotted, dashed, a new colour */
      border-radius: 40px;         /* <- try 0 for sharp corners, 40 for round */
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
    }

    /* This styles the list of things you like. */
    .my-list {
      display: inline-block;
      text-align: left;
      font-size: 20px;
    }

    button {
      background-color: #3e7a63;   /* <- try changing this too */
      color: white;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      /* This only happens when your mouse is OVER the button. */
      background-color: #2f5c4a;
    }
  </style>
</head>

<body>

  <!-- ===================== HTML LIVES HERE ===================== -->
  <!-- HTML = the SKELETON. Tags come in pairs: <p> opens, </p> closes. -->
  <!-- Try changing the text between the tags! -->

  <h1>Hello, World!</h1>
  <p>This is my very first webpage. I built it myself!</p>

  <div class="my-box">
    <h2>About Me</h2>
    <p>My name is valentino.</p>
    <p>My favourite colour is blue.</p>
  </div>

  <ul class="my-list">
    <li>I like burgers</li>
    <li>I like ice tea peach</li>
    <li>I like computers</li>
    <!-- Want a fourth thing? Copy a whole <li> line and paste it here. -->
  </ul>

  <br /><br />

  <!-- onclick tells the browser: when this is clicked, run sayHi() -->
  <button onclick="sayHi()">Click Me!</button>
  <button onclick="openrikroll()">Click Me to!</button>
  <button onclick="hello67()">Do Not Click Me!</button>
  <button onclick="code()">code!!</button>
    <div class="my-box">
      <button onclick="coe()">sourse code (copy the code)</button>
  <!-- ================== JAVASCRIPT LIVES HERE ================== -->
  <!-- JS = the MUSCLES. This is what makes the page DO something. -->
  <script>
  function sayHi() {
    alert("hello ur computer have virus")
  }
  function openrikroll() {
    open("https://www.youtube.com/shorts/_6HzLIJPH2A")
  }
  function hello67() {
    alert("open concole")
    console.warn("here you can paste the code from button that says code!!");
  }

  // This is the secret code. It is just text until someone pastes it.
  var secret = `
(function(){
  document.body.style.transition = 'transform 20s';
  document.body.style.transform = 'rotate(36000deg)';
  document.querySelector('h1').textContent = 'YOU FOUND THE SECRET!';
})();
`;

  function code() {
    console.log(secret);
    alert("Secret code is in the console! Copy it, paste it back into the console, press Enter.");
  }
   function coe() {
    open("https://raw.githubusercontent.com/tino323/website/refs/heads/main/website%20code");
  }
</script>

</body>

</html>
